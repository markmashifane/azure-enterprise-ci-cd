name: Enterprise CI Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:

    name: Repository Validation

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Verify Azure CLI
        run: az --version

      - name: Install Bicep
        run: az bicep install

      - name: Verify Bicep
        run: az bicep version

      - name: Validate PowerShell
        shell: pwsh
        run: |
          ./scripts/validate.ps1

      - name: Verify Repository Structure
        run: |
          test -f README.md
          test -f LICENSE
          test -f CHANGELOG.md
          test -f CONTRIBUTING.md
          test -d .github
          test -d scripts

      - name: Upload Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: azure-enterprise-ci-cd
          path: |
            README.md
            CHANGELOG.md
            CONTRIBUTING.md
            LICENSE
            scripts/
            .github/workflows/

      - name: Pipeline Completed
        run: echo "Enterprise CI Pipeline completed successfully."